# Lancement de l'application en conteneur.
#
#   docker compose up -d --build     demarre (et reconstruit si le code a change)
#   docker compose logs -f           suit les messages du serveur
#   docker compose down              arrete
#
# Le jeton GenIAL vient du fichier .env, jamais de ce fichier-ci : celui-ci est
# versionne, .env ne l'est pas.

services:
  meeting-ct:
    build: .
    container_name: meeting-ct

    # "8000:8000" = le port 8000 de la machine est redirige vers le port 8000
    # du conteneur. Pour servir sur un autre port de la machine, changer
    # seulement le nombre de GAUCHE : "9000:8000".
    ports:
      - "8000:8000"

    # Le fichier .env est lu au demarrage et ses variables sont posees dans le
    # conteneur. C'est ici que GENIAL_TOKEN arrive, sans jamais entrer dans
    # l'image.
    env_file:
      - .env

    # Reglages de deploiement, surchargeables sans toucher a config.py.
    environment:
      MEETING_HOST: "0.0.0.0"
      # Les reunions sont conservees ici, donc dans le volume ci-dessous.
      # Sans ca, un redemarrage du conteneur perdrait les comptes rendus
      # qu'une application tierce n'est pas encore venue chercher.
      MEETING_DONNEES: "/donnees"
      # MEETING_MOTEUR: "genial"
      # MEETING_MODELE: "<nom du modele de redaction>"
      # MEETING_MODE: "differe"
      # HTTPS : sans certificat, le navigateur refuse le micro aux postes
      # distants. Decommenter apres avoir place les fichiers dans ./certificats
      # MEETING_SSL_CERT: "/certificats/certificat.pem"
      # MEETING_SSL_KEY: "/certificats/cle.pem"

    # Redemarre tout seul apres un plantage ou un redemarrage de la machine,
    # mais reste arrete si on l'a arrete a la main. C'est ce qui fait qu'un
    # serveur n'a pas besoin qu'on le relance a la main.
    restart: unless-stopped

    volumes:
      # Les reunions survivent aux redemarrages et aux reconstructions de
      # l'image. Elles sont effacees d'elles-memes au bout de
      # MEETING_RETENTION_JOURS (7 par defaut).
      - meeting-donnees:/donnees
      # Le certificat est monte, jamais copie dans l'image : une cle privee ne
      # se partage pas. Lecture seule, le serveur n'a pas a y ecrire.
      - ./certificats:/certificats:ro

volumes:
  meeting-donnees:
